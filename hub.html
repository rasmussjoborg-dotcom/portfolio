<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rsjo hub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --color-bg: #000000;
            --color-surface: #0a0a0a;
            --color-surface-hover: #111111;
            --color-text-main: #ededed;
            --color-text-muted: #888888;
            --color-border: #333333;
            --color-border-hover: #555555;
            --color-accent: #FDFEBD;
            --color-accent-glow: rgba(253, 254, 189, 0.15);
            --font-main: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Space Mono', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--color-accent); color: #000; }

        body {
            background: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Noise overlay — matches portfolio */
        .noise-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Password Gate ── */
        .gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1.5rem;
        }

        .gate-logo { font-size: 2.5rem; margin-bottom: 0.5rem; }

        .gate-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-accent);
        }

        .gate-input {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.5rem;
            color: var(--color-text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            width: 280px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .gate-input:focus { border-color: var(--color-accent); }
        .gate-input::placeholder { color: var(--color-text-muted); }

        .gate-error {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #ff6b6b;
            height: 1rem;
        }

        /* ── Hub Layout ── */
        .hub { display: none; max-width: 1100px; margin: 0 auto; padding: 0 2rem 4rem; }
        .hub.visible { display: block; }

        .hub-header {
            padding: 4rem 0 3rem;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hub-title {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -0.04em;
            color: var(--color-text-main);
        }

        .hub-title strong {
            font-weight: 600;
        }

        .hub-tagline {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
            letter-spacing: 0.02em;
        }

        .hub-tagline::before { content: '> '; opacity: 0.4; }

        /* ── Sections ── */
        .section-group {
            margin-bottom: 3rem;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-text-muted);
            padding-bottom: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .section-label::before { content: '// '; opacity: 0.4; }

        .section-cards {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .section-cards::-webkit-scrollbar { height: 0; }

        /* ── Cards ── */
        .nav-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-decoration: none;
            color: var(--color-text-main);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-width: 260px;
            flex: 1;
            max-width: 340px;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .nav-card:hover {
            border-color: var(--color-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -8px rgba(0, 0, 0, 0.5);
        }

        .nav-card:hover::before { opacity: 1; }

        .nav-card.placeholder {
            opacity: 0.35;
            cursor: default;
            border-style: dashed;
        }

        .nav-card.placeholder:hover {
            transform: none;
            box-shadow: none;
            border-color: var(--color-border);
        }

        .nav-card.placeholder::before { display: none; }

        .nav-card-icon { font-size: 1.4rem; }

        .nav-card-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .nav-card-desc {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            line-height: 1.5;
        }

        /* ── Card Preview Panels ── */
        .card-preview {
            margin-top: 0.4rem;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
        }

        .preview-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .preview-wide { grid-column: 1 / -1; }

        .preview-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-muted);
        }

        .preview-value {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .preview-active {
            color: var(--color-accent);
            font-weight: 400;
            font-size: 0.75rem;
        }

        .preview-loading, .preview-empty {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--color-text-muted);
            padding: 0.2rem 0;
        }

        /* ── Sub-views (Approved Ideas, etc.) ── */
        .section-view { display: none; }
        .section-view.visible { display: block; }

        .section-back {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 3rem 0 1rem;
            display: inline-block;
            text-decoration: none;
            transition: color 0.2s;
        }

        .section-back:hover { color: var(--color-accent); }
        .section-back::before { content: '← '; }

        .section-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 0.25rem;
        }

        .section-subtitle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-bottom: 2rem;
        }

        .section-subtitle::before { content: '// '; opacity: 0.5; }

        /* ── Project Grid ── */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
            margin-bottom: 4rem;
        }

        .project-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .project-card:hover {
            border-color: var(--color-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title { font-size: 1.05rem; font-weight: 600; }

        .card-nights {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-accent);
            background: var(--color-accent-glow);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .card-idea {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }

        .card-links { display: flex; gap: 0.75rem; margin-top: auto; flex-wrap: wrap; }

        .card-link {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-text-main);
            text-decoration: none;
            padding: 0.35rem 0.7rem;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .card-link:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-glow);
        }

        /* ── WIP Card (Work in Progress) ── */
        .wip-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .wip-card:hover {
            border-color: var(--color-border-hover);
            box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .wip-card {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        .wip-info {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .wip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .wip-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .wip-status {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .wip-status.building {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .wip-status.reviewing {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .wip-status.presented {
            color: #34d399;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .wip-desc {
            font-size: 0.9rem;
            color: var(--color-text-muted);
            line-height: 1.6;
        }

        .wip-meta {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
            display: flex;
            gap: 1.5rem;
        }

        .wip-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .wip-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .pick-btn {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            color: #000;
            background: var(--color-accent);
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .pick-btn:hover {
            background: #e8e9a0;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(253, 254, 189, 0.3);
        }

        .pick-btn:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        /* ── Phone Frame ── */
        .phone-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .phone-frame {
            width: 260px;
            height: 520px;
            border-radius: 36px;
            border: 3px solid #2a2a2a;
            background: #000;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 1px #1a1a1a, 0 20px 50px -15px rgba(0, 0, 0, 0.7);
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 22px;
            background: #000;
            border-radius: 0 0 16px 16px;
            z-index: 2;
        }

        .phone-notch::after {
            content: '';
            position: absolute;
            top: 7px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #1a1a1a;
            border-radius: 50%;
        }

        .phone-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #111;
        }

        /* ── Variation Tabs ── */
        .var-tabs {
            display: flex;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 3px;
        }

        .var-tab {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .var-tab:hover {
            color: var(--color-text-main);
            background: rgba(255, 255, 255, 0.06);
        }

        .var-tab.active {
            background: var(--color-accent);
            color: #000;
        }

        /* ── Active Build Banner ── */
        .active-build {
            padding: 0.85rem 1.25rem;
            background: rgba(253, 254, 189, 0.03);
            border: 1px solid rgba(253, 254, 189, 0.15);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .active-pulse {
            width: 8px; height: 8px;
            background: var(--color-accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .active-text { font-size: 0.85rem; }
        .active-text strong { color: var(--color-accent); }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 2rem;
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Queue ── */
        .queue-section { margin-bottom: 3rem; }
        .queue-label {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-accent);
            margin-bottom: 1rem;
        }
        .queue-label::before { content: '// '; opacity: 0.5; }

        .queue-list { display: flex; flex-direction: column; gap: 0.4rem; }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1rem;
            background: var(--color-surface);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
        }

        .queue-pos {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-accent);
            min-width: 2rem;
        }

        .queue-idea { font-size: 0.85rem; flex: 1; }

        .queue-date {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }

        /* ── Footer ── */
        .hub-footer {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
            text-align: center;
            padding: 3rem 0 2rem;
            border-top: 1px solid var(--color-border);
            margin-top: 1rem;
        }

        .hub-footer a { color: var(--color-text-main); text-decoration: none; }
        .hub-footer a:hover { color: var(--color-accent); }

        /* ── Iframe View ── */
        .iframe-view {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--color-bg);
            z-index: 100;
            display: none;
        }

        .iframe-view.visible { display: flex; flex-direction: column; }

        .iframe-topbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-surface);
            flex-shrink: 0;
        }

        .iframe-back {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--color-text-muted);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.2s;
        }

        .iframe-back:hover { color: var(--color-accent); }
        .iframe-back::before { content: '← '; }

        .iframe-title {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--color-text-main);
            font-weight: 600;
        }

        .iframe-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .hub { padding: 0 1.25rem 4rem; }
            .section-cards { flex-direction: column; }
            .nav-card { min-width: unset; max-width: unset; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="noise-overlay"></div>

    <!-- Password Gate -->
    <div class="gate" id="gate">
        <div class="gate-logo">⚡</div>
        <span class="gate-title">rsjo hub</span>
        <input type="password" class="gate-input" id="passwordInput" placeholder="password" autofocus>
        <div class="gate-error" id="gateError"></div>
    </div>

    <!-- Hub Content -->
    <div class="hub" id="hub">
        <!-- Main Dashboard -->
        <div id="dashboardView">
            <header class="hub-header">
                <h1 class="hub-title"><strong>rsjo</strong> hub</h1>
                <p class="hub-tagline">All systems. One place.</p>
            </header>

            <!-- Sections rendered by JS -->
            <div id="sectionsContainer"></div>

            <footer class="hub-footer">
                // built by <a href="https://rsjo.io">rasmus.sjöborg</a>
            </footer>
        </div>

        <!-- Approved Ideas Sub-view -->
        <div class="section-view" id="approvedIdeasView">
            <a class="section-back" onclick="showDashboard()">Back to Hub</a>
            <h2 class="section-title">Approved Ideas</h2>
            <p class="section-subtitle">NIGHT SHIFT — shipped prototypes</p>
            <div id="appsContent">
                <div class="loading"><div class="spinner"></div> Fetching projects...</div>
            </div>
        </div>
    </div>

    <!-- The Judge Iframe View -->
    <div class="iframe-view" id="judgeView">
        <div class="iframe-topbar">
            <a class="iframe-back" onclick="hideJudge()">Back to Hub</a>
            <span class="iframe-title">🏛️ The Judge</span>
        </div>
        <iframe class="iframe-frame" id="judgeFrame" src=""></iframe>
    </div>

    <script>
        const API_BASE = 'https://gravity-claw-production-6bdf.up.railway.app';
        let password = '';

        // ── Section + Card Registry ──
        const SECTIONS = [
            {
                id: 'personal',
                label: 'Personal',
                cards: [
                    { id: 'placeholder-personal-1', icon: '👤', title: 'Coming soon', desc: 'Personal projects will appear here.', placeholder: true },
                ],
            },
            {
                id: 'work',
                label: 'Work',
                cards: [
                    { id: 'placeholder-work-1', icon: '💼', title: 'Coming soon', desc: 'Work projects will appear here.', placeholder: true },
                ],
            },
            {
                id: 'trade',
                label: 'Trade',
                cards: [
                    { id: 'judge', icon: '🏛️', title: 'The Judge', desc: 'AI-powered XAUUSD macro-sentiment scan.', action: 'showJudge' },
                ],
            },
            {
                id: 'build',
                label: 'Build',
                cards: [
                    { id: 'approved-ideas', icon: '🌙', title: 'Approved Ideas', desc: 'Night Shift shipped prototypes.', action: 'showApprovedIdeas' },
                    { id: 'factory', icon: '🏭', title: 'The Factory', desc: 'Polish and iterate until production ready.', placeholder: true },
                    { id: 'appstore', icon: '🚀', title: 'App Store', desc: 'Finished apps ready for upload.', placeholder: true },
                ],
            },
        ];

        // ── Password Gate ──
        const gate = document.getElementById('gate');
        const hub = document.getElementById('hub');
        const passwordInput = document.getElementById('passwordInput');
        const gateError = document.getElementById('gateError');

        const savedPw = sessionStorage.getItem('hub_pw');
        if (savedPw) { password = savedPw; unlock(); }

        passwordInput.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;
            gateError.textContent = '';
            password = passwordInput.value;

            try {
                const res = await fetch(`${API_BASE}/api/shipped-projects?pw=${encodeURIComponent(password)}`);
                if (res.status === 401) {
                    gateError.textContent = '// access denied';
                    passwordInput.value = '';
                    return;
                }
                sessionStorage.setItem('hub_pw', password);
                unlock();
            } catch (err) {
                gateError.textContent = '// connection failed';
            }
        });

        async function unlock() {
            gate.style.display = 'none';
            hub.classList.add('visible');
            renderDashboard();
        }

        // ── Dashboard ──
        function renderDashboard() {
            const container = document.getElementById('sectionsContainer');

            container.innerHTML = SECTIONS.map(section => {
                const cards = section.cards.map(c => {
                    const placeholderClass = c.placeholder ? ' placeholder' : '';
                    const onclick = c.action ? `onclick="${c.action}()"` : '';
                    return `
                        <div class="nav-card${placeholderClass}" ${onclick}>
                            <span class="nav-card-icon">${c.icon}</span>
                            <span class="nav-card-title">${c.title}</span>
                            <span class="nav-card-desc">${c.desc}</span>
                            ${!c.placeholder ? `<div class="card-preview" id="preview-${c.id}"><div class="preview-loading">Loading...</div></div>` : ''}
                        </div>`;
                }).join('');

                return `
                    <div class="section-group">
                        <div class="section-label">${section.label}</div>
                        <div class="section-cards">${cards}</div>
                    </div>`;
            }).join('');

            // Fetch live data
            fetchJudgePreview();
            fetchAppsPreview();
        }

        async function fetchJudgePreview() {
            const el = document.getElementById('preview-judge');
            if (!el) return;
            try {
                const res = await fetch('https://judge.rsjo.io/api/scan', { signal: AbortSignal.timeout(8000) });
                if (!res.ok) { el.innerHTML = '<div class="preview-empty">No scan today</div>'; return; }
                const data = await res.json();
                const v = data.verdict || {};
                const bias = v.final_decision || '—';
                const score = v.certainty_score ?? '—';
                const regime = v.regime_detected || '—';
                const time = data.metadata?.scan_time
                    ? new Date(data.metadata.scan_time).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
                    : '—';
                const biasColor = bias === 'LONG' ? '#4ade80' : bias === 'SHORT' ? '#f87171' : '#fbbf24';

                el.innerHTML = `
                    <div class="preview-grid">
                        <div class="preview-item">
                            <span class="preview-label">Bias</span>
                            <span class="preview-value" style="color:${biasColor}">${bias}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Conviction</span>
                            <span class="preview-value">${score}%</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Regime</span>
                            <span class="preview-value">${regime}</span>
                        </div>
                        <div class="preview-item">
                            <span class="preview-label">Scanned</span>
                            <span class="preview-value">${time}</span>
                        </div>
                    </div>`;
            } catch {
                el.innerHTML = '<div class="preview-empty">Offline</div>';
            }
        }

        async function fetchAppsPreview() {
            const el = document.getElementById('preview-approved-ideas');
            if (!el) return;
            try {
                const [shipped, queue] = await Promise.all([
                    fetch(`${API_BASE}/api/shipped-projects?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                    fetch(`${API_BASE}/api/queue?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                ]);

                const shipCount = shipped.projects?.length ?? 0;
                const queueCount = queue.queue?.length ?? 0;
                const active = queue.active?.[0];

                let html = '<div class="preview-grid">';
                html += `
                    <div class="preview-item">
                        <span class="preview-label">Shipped</span>
                        <span class="preview-value">${shipCount}</span>
                    </div>
                    <div class="preview-item">
                        <span class="preview-label">Queue</span>
                        <span class="preview-value">${queueCount}</span>
                    </div>`;

                if (active) {
                    html += `
                        <div class="preview-item preview-wide">
                            <span class="preview-label">Building</span>
                            <span class="preview-value preview-active">⚡ ${esc(active.title)} — Night ${active.night_number}</span>
                        </div>`;
                }
                html += '</div>';
                el.innerHTML = html;
            } catch {
                el.innerHTML = '<div class="preview-empty">Could not load</div>';
            }
        }

        // ── Judge View ──
        function showJudge() {
            document.getElementById('judgeFrame').src = 'https://judge.rsjo.io';
            document.getElementById('judgeView').classList.add('visible');
        }

        function hideJudge() {
            document.getElementById('judgeView').classList.remove('visible');
            document.getElementById('judgeFrame').src = '';
        }

        // ── Approved Ideas View ──
        function showApprovedIdeas() {
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('approvedIdeasView').classList.add('visible');
            loadApprovedIdeas();
        }

        function showDashboard() {
            document.getElementById('approvedIdeasView').classList.remove('visible');
            document.getElementById('dashboardView').style.display = 'block';
        }

        async function loadApprovedIdeas() {
            const content = document.getElementById('appsContent');
            try {
                const [shipped, queue] = await Promise.all([
                    fetch(`${API_BASE}/api/shipped-projects?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                    fetch(`${API_BASE}/api/queue?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                ]);

                let html = '';

                // Active build banner
                if (queue.active && queue.active.length > 0) {
                    for (const a of queue.active) {
                        if (!a.vercel_url) {
                            html += `
                                <div class="active-build">
                                    <div class="active-pulse"></div>
                                    <span class="active-text">Building <strong>${esc(a.title)}</strong> — Night ${a.night_number}</span>
                                </div>`;
                        }
                    }
                }

                // Split projects into WIP vs Completed
                const allProjects = shipped.projects || [];
                const wipProjects = allProjects.filter(p => ['building', 'reviewing', 'presented'].includes(p.status));
                const doneProjects = allProjects.filter(p => ['iterating', 'shipped'].includes(p.status));

                // ── WIP Section ──
                if (wipProjects.length > 0) {
                    html += `<div class="queue-label">Work in Progress (${wipProjects.length})</div>`;
                    for (const p of wipProjects) {
                        const idea = p.idea_raw ? p.idea_raw.split('\n')[0].slice(0, 200) : '';
                        const activeVar = p.selected_variation || 'v1';
                        const date = new Date(p.updated_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                        html += `
                        <div class="wip-card" id="wip-${p.slug}">
                            <div class="wip-info">
                                <div class="wip-header">
                                    <span class="wip-title">${esc(p.title)}</span>
                                    <span class="wip-status ${p.status}">${p.status}</span>
                                </div>
                                ${idea ? `<div class="wip-desc">${esc(idea)}</div>` : ''}
                                <div class="wip-meta">
                                    <span>Night ${p.night_number}</span>
                                    <span>${date}</span>
                                </div>
                                <div class="wip-actions">
                                    <div class="wip-links">
                                        ${p.vercel_url ? `<a href="${p.vercel_url}/v1" target="_blank" class="card-link">V1 ↗</a>` : ''}
                                        ${p.vercel_url ? `<a href="${p.vercel_url}/v2" target="_blank" class="card-link">V2 ↗</a>` : ''}
                                        ${p.vercel_url ? `<a href="${p.vercel_url}/v3" target="_blank" class="card-link">V3 ↗</a>` : ''}
                                        ${p.repo_url ? `<a href="${p.repo_url}" target="_blank" class="card-link">GitHub ↗</a>` : ''}
                                    </div>
                                    <button class="pick-btn" onclick="pickVariation('${p.slug}')" id="pick-${p.slug}">
                                        Lock in <span id="pick-label-${p.slug}">${activeVar.toUpperCase()}</span>
                                    </button>
                                </div>
                            </div>
                        </div>`;
                    }
                }

                // ── Queue ──
                if (queue.queue && queue.queue.length > 0) {
                    html += `<div class="queue-section">`;
                    html += `<div class="queue-label">Queue (${queue.queue.length})</div>`;
                    html += `<div class="queue-list">`;
                    queue.queue.forEach((item, i) => {
                        const date = new Date(item.created_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                        html += `
                            <div class="queue-item">
                                <span class="queue-pos">#${i + 1}</span>
                                <span class="queue-idea">${esc(item.idea)}</span>
                                <span class="queue-date">${date}</span>
                            </div>`;
                    });
                    html += `</div></div>`;
                }

                // ── Shipped / Done ──
                if (doneProjects.length > 0) {
                    html += `<div class="queue-label">Shipped (${doneProjects.length})</div>`;
                    html += `<div class="project-grid">`;
                    for (const p of doneProjects) {
                        const date = new Date(p.updated_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                        const idea = p.idea_raw ? p.idea_raw.split('\n')[0].slice(0, 150) : '';
                        html += `
                            <div class="project-card">
                                <div class="card-header">
                                    <span class="card-title">${esc(p.title)}</span>
                                    <span class="card-nights">${p.night_number} night${p.night_number > 1 ? 's' : ''}</span>
                                </div>
                                ${idea ? `<div class="card-idea">${esc(idea)}</div>` : ''}
                                <div class="card-meta">${p.status === 'shipped' ? 'shipped' : 'iterating'} · ${date}</div>
                                <div class="card-links">
                                    ${p.vercel_url ? `<a href="${p.vercel_url}/${p.selected_variation || 'v1'}" target="_blank" class="card-link">📱 ${(p.selected_variation || 'v1').toUpperCase()}</a>` : ''}
                                    ${p.repo_url ? `<a href="${p.repo_url}" target="_blank" class="card-link">🔗 GitHub</a>` : ''}
                                </div>
                            </div>`;
                    }
                    html += `</div>`;
                }

                if (allProjects.length === 0 && (!queue.queue || queue.queue.length === 0)) {
                    html = `<div class="empty-state">🌙 No prototypes yet. Send /new in Telegram to start.</div>`;
                }

                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state">❌ Could not connect to the API.</div>`;
            }
        }

        // ── Phone Frame Variation Switching ──
        function switchVar(slug, variation, baseUrl) {
            const iframe = document.getElementById(`frame-${slug}`);
            if (iframe) iframe.src = `${baseUrl}/${variation}`;

            // Update tabs
            const tabs = document.querySelectorAll(`#tabs-${slug} .var-tab`);
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update pick button label
            const label = document.getElementById(`pick-label-${slug}`);
            if (label) label.textContent = variation.toUpperCase();

            // Store active variation on the card
            const card = document.getElementById(`wip-${slug}`);
            if (card) card.dataset.activeVar = variation;
        }

        // ── Variation Picker ──
        async function pickVariation(slug) {
            const card = document.getElementById(`wip-${slug}`);
            const variation = card?.dataset?.activeVar || 'v1';
            const btn = document.getElementById(`pick-${slug}`);

            if (!confirm(`Lock in ${variation.toUpperCase()} for ${slug}? This will start the iteration phase.`)) return;

            btn.disabled = true;
            btn.textContent = 'Locking in...';

            try {
                const res = await fetch(`${API_BASE}/api/select-variation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ slug, variation, pw: password }),
                });

                if (res.ok) {
                    btn.textContent = `✅ ${variation.toUpperCase()} locked in!`;
                    btn.style.background = '#34d399';
                    setTimeout(() => loadApprovedIdeas(), 1500);
                } else {
                    const err = await res.json();
                    btn.textContent = `❌ ${err.error || 'Failed'}`;
                    btn.disabled = false;
                }
            } catch {
                btn.textContent = '❌ Network error';
                btn.disabled = false;
            }
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>

</html>
