<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS — Prototype Hub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --color-bg: #000000;
            --color-surface: #0a0a0a;
            --color-surface-hover: #111111;
            --color-text-main: #ededed;
            --color-text-muted: #888888;
            --color-border: #333333;
            --color-border-hover: #555555;
            --color-accent: #FDFEBD;
            --color-accent-glow: rgba(253, 254, 189, 0.15);
            --font-main: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Space Mono', monospace;
            --radius-sm: 8px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::selection { background: var(--color-accent); color: #000; }

        body {
            background: var(--color-bg);
            color: var(--color-text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── Password Gate ── */
        .gate {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1.5rem;
        }

        .gate-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-accent);
        }

        .gate-title::before { content: '> '; opacity: 0.6; }

        .gate-input {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.5rem;
            color: var(--color-text-main);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            width: 280px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        .gate-input:focus { border-color: var(--color-accent); }
        .gate-input::placeholder { color: var(--color-text-muted); }

        .gate-error {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #ff6b6b;
            height: 1rem;
        }

        /* ── Hub Layout ── */
        .hub { display: none; padding: 0 max(3rem, 4vw); }
        .hub.visible { display: block; }

        .hub-header {
            padding: 4rem 0 2rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .hub-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .hub-subtitle {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .hub-subtitle::before { content: '// '; opacity: 0.5; }

        /* ── Section Labels ── */
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-accent);
            margin-bottom: 1.5rem;
        }

        .section-label::before { content: '// '; opacity: 0.5; }

        /* ── Project Grid ── */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .project-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-card:hover {
            border-color: var(--color-border-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px -10px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .card-nights {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-accent);
            background: var(--color-accent-glow);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .card-idea {
            font-size: 0.88rem;
            color: var(--color-text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
            letter-spacing: 0.02em;
        }

        .card-links {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
        }

        .card-link {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--color-text-main);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-link:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-glow);
        }

        /* ── Queue Section ── */
        .queue-section { margin-bottom: 4rem; }

        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: var(--color-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
        }

        .queue-pos {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-accent);
            min-width: 2rem;
        }

        .queue-idea {
            font-size: 0.88rem;
            color: var(--color-text-main);
            flex: 1;
        }

        .queue-date {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
        }

        /* ── Active Build ── */
        .active-build {
            padding: 1rem 1.25rem;
            background: rgba(253, 254, 189, 0.03);
            border: 1px solid rgba(253, 254, 189, 0.15);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .active-pulse {
            width: 8px;
            height: 8px;
            background: var(--color-accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .active-text {
            font-size: 0.88rem;
        }

        .active-text strong {
            color: var(--color-accent);
        }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--color-text-muted);
        }

        .empty-emoji { font-size: 2.5rem; margin-bottom: 1rem; }
        .empty-text { font-size: 0.9rem; }

        /* ── Divider ── */
        .hub-divider {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-border);
            padding: 1rem 0 2rem;
            overflow: hidden;
            white-space: nowrap;
        }

        /* ── Footer ── */
        .hub-footer {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--color-text-muted);
            text-align: center;
            padding: 2rem 0 3rem;
        }

        .hub-footer a {
            color: var(--color-text-main);
            text-decoration: none;
        }
        .hub-footer a:hover { color: var(--color-accent); }

        /* ── Loading ── */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 2rem;
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .hub { padding: 0 1.5rem; }
            .project-grid { grid-template-columns: 1fr; }
            .hub-header { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>

<body>
    <!-- Password Gate -->
    <div class="gate" id="gate">
        <span class="gate-title">Night Shift Hub</span>
        <input type="password" class="gate-input" id="passwordInput" placeholder="password" autofocus>
        <div class="gate-error" id="gateError"></div>
    </div>

    <!-- Hub Content -->
    <div class="hub" id="hub">
        <header class="hub-header">
            <h1 class="hub-title">Prototype Hub</h1>
            <span class="hub-subtitle">NIGHT_SHIFT</span>
        </header>

        <div id="hubContent">
            <div class="loading"><div class="spinner"></div> Fetching projects...</div>
        </div>

        <footer class="hub-footer">
            // built by <a href="/">rasmus.sjoborg</a> — night shift v2026.03
        </footer>
    </div>

    <script>
        // Config — set your Railway URL here
        const API_BASE = 'https://gravity-claw-production-6bdf.up.railway.app';
        let password = '';

        // ── Password Gate ──
        const gate = document.getElementById('gate');
        const hub = document.getElementById('hub');
        const passwordInput = document.getElementById('passwordInput');
        const gateError = document.getElementById('gateError');

        // Check session
        const savedPw = sessionStorage.getItem('hub_pw');
        if (savedPw) {
            password = savedPw;
            unlock();
        }

        passwordInput.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;
            gateError.textContent = '';
            password = passwordInput.value;

            try {
                const res = await fetch(`${API_BASE}/api/shipped-projects?pw=${encodeURIComponent(password)}`);
                if (res.status === 401) {
                    gateError.textContent = '// access denied';
                    passwordInput.value = '';
                    return;
                }
                sessionStorage.setItem('hub_pw', password);
                unlock();
            } catch (err) {
                gateError.textContent = '// connection failed';
            }
        });

        async function unlock() {
            gate.style.display = 'none';
            hub.classList.add('visible');
            await loadHub();
        }

        async function loadHub() {
            const content = document.getElementById('hubContent');
            try {
                const [shipped, queue] = await Promise.all([
                    fetch(`${API_BASE}/api/shipped-projects?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                    fetch(`${API_BASE}/api/queue?pw=${encodeURIComponent(password)}`).then(r => r.json()),
                ]);

                let html = '';

                // Active build
                if (queue.active && queue.active.length > 0) {
                    const a = queue.active[0];
                    html += `
                        <div class="active-build">
                            <div class="active-pulse"></div>
                            <span class="active-text">Building <strong>${esc(a.title)}</strong> — Night ${a.night_number} (${a.status})</span>
                        </div>`;
                }

                // Queue
                if (queue.queue && queue.queue.length > 0) {
                    const sorted = [...queue.queue].reverse();
                    html += `<div class="queue-section">`;
                    html += `<div class="section-label">QUEUE (${sorted.length})</div>`;
                    html += `<div class="queue-list">`;
                    sorted.forEach((item, i) => {
                        const date = new Date(item.created_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                        html += `
                            <div class="queue-item">
                                <span class="queue-pos">#${i + 1}</span>
                                <span class="queue-idea">${esc(item.idea)}</span>
                                <span class="queue-date">${date}</span>
                            </div>`;
                    });
                    html += `</div></div>`;
                }

                // Divider
                if (shipped.projects && shipped.projects.length > 0) {
                    html += `<div class="hub-divider">// ————————————————————————————————————————————————————————————————————————————</div>`;
                }

                // Shipped projects
                if (shipped.projects && shipped.projects.length > 0) {
                    html += `<div class="section-label">SHIPPED (${shipped.projects.length})</div>`;
                    html += `<div class="project-grid">`;
                    for (const p of shipped.projects) {
                        const date = new Date(p.updated_at + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                        const idea = p.idea_raw ? p.idea_raw.split('\n')[0].slice(0, 150) : '';
                        html += `
                            <div class="project-card">
                                <div class="card-header">
                                    <span class="card-title">${esc(p.title)}</span>
                                    <span class="card-nights">${p.night_number} night${p.night_number > 1 ? 's' : ''}</span>
                                </div>
                                ${idea ? `<div class="card-idea">${esc(idea)}</div>` : ''}
                                <div class="card-meta">shipped ${date} · ${p.selected_variation?.toUpperCase() || '—'}</div>
                                <div class="card-links">
                                    ${p.vercel_url ? `<a href="${p.vercel_url}/${p.selected_variation || 'v1'}" target="_blank" class="card-link">📱 Prototype</a>` : ''}
                                    ${p.repo_url ? `<a href="${p.repo_url}" target="_blank" class="card-link">🔗 GitHub</a>` : ''}
                                </div>
                            </div>`;
                    }
                    html += `</div>`;
                }

                // Empty state
                if ((!shipped.projects || shipped.projects.length === 0) && (!queue.queue || queue.queue.length === 0)) {
                    html = `
                        <div class="empty-state">
                            <div class="empty-emoji">🌙</div>
                            <p class="empty-text">No prototypes yet. Send /new in Telegram to start.</p>
                        </div>`;
                }

                content.innerHTML = html;
            } catch (err) {
                content.innerHTML = `<div class="empty-state"><p class="empty-text">❌ Could not connect to the API.</p></div>`;
            }
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>

</html>
